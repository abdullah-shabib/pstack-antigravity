name: Validate plugin

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-plugin.mjs
      - run: bash -n skills/poteto-mode/scripts/worktree-audit.sh
      - run: bash -n skills/show-me-your-work/scripts/log.sh
